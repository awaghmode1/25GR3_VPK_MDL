
# Azure DevOps Pipeline for GVault Deployment Automation (no Python code in YAML)
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true

# Step 2: Create & activate venv and install deps
- script: |
    set -euo pipefail
    python -m venv .venv
    source .venv/bin/activate
    python -m pip install --upgrade pip
    pip install requests pandas
    which python
    python --version
    pip --version
  displayName: 'Create venv and install dependencies'

# Step 3: Download Secure Files (authentication.json, payload.json, deployment.json)
# Upload these in Pipelines > Library > Secure files before running the pipeline
- task: DownloadSecureFile@1
  name: authJson
  inputs:
    secureFile: 'authentication.json'
- task: DownloadSecureFile@1
  name: payloadJson
  inputs:
    secureFile: 'payload.json'
- task: DownloadSecureFile@1
  name: deploymentJson
  inputs:
    secureFile: 'deployment.json'

# Step 4: Place secure files into the working directory
- bash: |
    set -euo pipefail
    # Copy secure files into repo root (adjust path if needed)
    cp "$(authJson.secureFilePath)" authentication.json
    cp "$(payloadJson.secureFilePath)" payload.json
    cp "$(deploymentJson.secureFilePath)" deployment.json
    #cp "$(deploymentStepsCsv.secureFilePath)" GVault_Deployment_Steps.csv
    echo "Working dir:"
    pwd
    ls -la
    echo "Deployment_Automation tree:"
    ls -R Deployment_Automation || true
  displayName: 'Prepare configuration files (Secure Files)'
    
    
# Step 5: Run the Python script (via venv)
- bash: |
    set -euo pipefail
    source .venv/bin/activate
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run gvault_25gr2_deployment.py'

# Step 6: Publish logs and outputs (always)
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
