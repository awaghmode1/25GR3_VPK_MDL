
# Azure DevOps Pipeline for GVault Deployment Automation
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# Step 2: Install dependencies
- script: |
    set -euo pipefail
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'


# Step 3: Decode & validate configuration files from Base64 env variables
- script: |
    set -euo pipefail

    # Check variables exist
    [ -n "${AUTH_JSON_B64:-}" ] || { echo "AUTH_JSON_B64 is empty"; exit 1; }
    [ -n "${PAYLOAD_JSON_B64:-}" ] || { echo "PAYLOAD_JSON_B64 is empty"; exit 1; }
    [ -n "${DEPLOYMENT_JSON_B64:-}" ] || { echo "DEPLOYMENT_JSON_B64 is empty"; exit 1; }

    # Decode Base64 and write JSON files
    echo "$AUTH_JSON_B64"       | base64 --decode > authentication.json
    echo "$PAYLOAD_JSON_B64"    | base64 --decode > payload.json
    echo "$DEPLOYMENT_JSON_B64" | base64 --decode > deployment.json

    # Validate JSON using Python
    python - << 'PY'
    import json,sys
    for f in ("authentication.json","payload.json","deployment.json"):
        try:
            with open(f) as fh: json.load(fh)
            print(f"{f}: OK")
        except Exception as e:
            print(f"{f}: INVALID => {e}")
            sys.exit(1)
    PY
  displayName: 'Decode & validate configuration files'
  env:
    AUTH_JSON_B64: $(AUTH_JSON_B64)
    PAYLOAD_JSON_B64: $(PAYLOAD_JSON_B64)
    DEPLOYMENT_JSON_B64: $(DEPLOYMENT_JSON_B64)

# Step 4: Debug workspace (optional)
- script: |
    pwd
    ls -R
    echo "Preview CSV (if present):"
    head -n 5 Deployment_Automation/GVault_Deployment_Steps.csv || true
  displayName: 'Debug workspace'

# Step 5: Run deployment script
- script: |
    set -euo pipefail
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run deployment script'

# Step 6: Publish logs and outputs (always)
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
