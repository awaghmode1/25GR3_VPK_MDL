
trigger:
- 25GR3

pool:
  vmImage: 'windows-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true

- powershell: |
    python -m venv .venv
    .\.venv\Scripts\Activate.ps1
    python -m pip install --upgrade pip
    pip install requests pandas
    python --version
    pip --version
  displayName: 'Create venv and install dependencies'

- task: DownloadSecureFile@1
  name: authJson
  inputs:
    secureFile: 'authentication.json'
- task: DownloadSecureFile@1
  name: payloadJson
  inputs:
    secureFile: 'payload.json'
- task: DownloadSecureFile@1
  name: deploymentJson
  inputs:
    secureFile: 'deployment.json'

- powershell: |
    Copy-Item "$(authJson.secureFilePath)" -Destination authentication.json -Force
    Copy-Item "$(payloadJson.secureFilePath)" -Destination payload.json -Force
    Copy-Item "$(deploymentJson.secureFilePath)" -Destination deployment.json -Force
    Get-ChildItem -Recurse
  displayName: 'Prepare configuration files (Secure Files)'

- powershell: |
    .\.venv\Scripts\Activate.ps1
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run gvault_25gr2_deployment.py'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
