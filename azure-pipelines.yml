# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: CopyFiles@2
  displayName: Copy Python and VPK-MDL files
  inputs:
    SourceFolder: '$(system.defaultWorkingDirectory)/Deployment_Automation/'
    Contents: |
      gvault_25gr2_deployment.py
      authentication.json
      deployment.json
      payload.json
      GVault_Deployment_Steps.csv
    TargetFolder: '$(Build.ArtifactStagingDirectory)/output'
- task: PublishBuildArtifacts@1
  displayName: Publish files to Stagiing
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/output'
    ArtifactName: 'drop'
    publishLocation: 'Container'


- task: DownloadSecureFile@1
  name: authFile
  inputs:
    secureFile: authentication.json

- script: |
    jobs:
    run-deployment-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas


      # Step 4: Verify required files exist
      - name: Check required files
        run: |
          for file in Deployment_Automation/authentication.json Deployment_Automation/payload.json Deployment_Automation/deployment.json Deployment_Automation/GVault_Deployment_Steps.csv; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      # Step 5: Run the deployment script
      - name: Execute deployment script
        run: |
          python Deployment_Automation/gvault_25gr2_deployment.py

      # Step 6: Upload logs and outputs as artifacts
      - name: Upload logs
        uses: actions/upload-artifact@v3
        with:
          name: deployment-logs
          path: |
            Deployment_Automation/logs/
            Deployment_Automation/output_files/
            Deployment_Automation/deployment_logs/

