trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # Step 4: Create config files from GitHub Secrets
      - name: Create configuration files
        run: |
          echo "${{ secrets.AUTH_JSON }}" > authentication.json
          echo "${{ secrets.PAYLOAD_JSON }}" > payload.json
          echo "${{ secrets.DEPLOYMENT_JSON }}" > deployment.json

      # Step 5: Run the deployment script
      - name: Execute deployment script
        run: |
          ls -R
          python Deployment_Automation/gvault_25gr2_deployment.py

      # Step 6: Upload logs and outputs as artifacts
      - name: Upload logs and outputs
        uses: actions/upload-artifact@v3
        with:
          name: deployment-artifacts
          path: |
            Deployment_Automation/logs/
            Deployment_Automation/output_files/
            Deployment_Automation/deployment_logs/
