
# Azure DevOps Pipeline for GVault Deployment Automation for 25GR3
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

variables:
  AUTH_JSON_B64: "<Base64-encoded-authentication.json>"
  PAYLOAD_JSON_B64: "<Base64-encoded-payload.json>"
  DEPLOYMENT_JSON_B64: "<Base64-encoded-deployment.json>"

steps:
# Step 1: Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# Step 2: Install dependencies
- script: |
    set -euo pipefail
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'


# Step 4: Run deployment script
- script: |
    set -euo pipefail
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run deployment script'

# Step 5: Publish logs and outputs
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
