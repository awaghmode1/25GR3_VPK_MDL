
# azure-pipelines.yml
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# Step 2: Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'

# Step 3: Create configuration files from pipeline variables
# Define AUTH_JSON, PAYLOAD_JSON, DEPLOYMENT_JSON in pipeline Variables (UI)
- script: |
    set -euo pipefail
    printf '%s' "$(AUTH_JSON)"       > authentication.json
    printf '%s' "$(PAYLOAD_JSON)"    > payload.json
    printf '%s' "$(DEPLOYMENT_JSON)" > deployment.json

    # Validate JSON
    python - << 'PY'
import json,sys
for f in ("authentication.json","payload.json","deployment.json"):
    try:
        with open(f) as fh: json.load(fh)
        print(f"{f}: OK")
    except Exception as e:
        print(f"{f}: INVALID => {e}")
        sys.exit(1)
PY
  displayName: 'Create & validate configuration files'

