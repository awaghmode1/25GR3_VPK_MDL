trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Use Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# Step 2: Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'

# Step 3: Download secure files (authentication.json, payload.json, deployment.json)
- task: DownloadSecureFile@1
  name: authFile
  inputs:
    secureFile: authentication.json

- task: DownloadSecureFile@1
  name: payloadFile
  inputs:
    secureFile: payload.json

- task: DownloadSecureFile@1
  name: deployFile
  inputs:
    secureFile: deployment.json

# Step 4: Copy secure files to working directory
- script: |
    cp $(authFile.secureFilePath) authentication.json
    cp $(payloadFile.secureFilePath) payload.json
    cp $(deployFile.secureFilePath) deployment.json
  displayName: 'Prepare config files'

# Step 5: Run the script
- script: |
    ls -R
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run deployment script'

# Step 6: Publish logs and outputs
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
