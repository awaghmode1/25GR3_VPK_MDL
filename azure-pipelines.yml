# Azure Pipelines: CSV-driven, per-module approvals (POC1 & Contigency)
# - Source of truth: Deployment_Automation/GVault_Deployment_Steps.csv
# - One deployment job per Module Name, with different approvers per environment
# - Uses ManualValidation@0 for module-specific approval notifications
# - Python venv installs pandas/openpyxl/requests; script reads CSV (not Excel)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: modules
  type: object
  default:
    # Defaults below are derived from your sample Approvals sheets
    # Findings
    - name: Findings
      poc1Approvers: [ 'Ashwini.Waghmode1@gilead.com', 'Rahul.Padole@gilead.com' ]
      poc1Policy: ALL
      poc1N: 2
      contApprovers: [ 'Ashwini.Waghmode1@gilead.com' ]
      contPolicy: ANY
      contN: 1
    # Safety
    - name: Safety
      poc1Approvers: [ 'Rahul.Padole@gilead.com' ]
      poc1Policy: ANY
      poc1N: 1
      contApprovers: [ 'Ashwini.Waghmode1@gilead.com' ]
      contPolicy: ALL
      contN: 1
    

variables:
  pythonVersion: '3.10'
  artifactName: 'Deployment Automation'

stages:
# ======================================
# Stage 1: Build (package + publish)
# ======================================
- stage: build
  displayName: Build & Package
  jobs:
  - job: build_job
    displayName: Build artifact
    steps:
    - checkout: self
      path: s
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true
    - bash: |
        set -euo pipefail
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install --no-cache-dir requests pandas openpyxl
        mkdir -p .package/project_root
        rsync -a --exclude='.venv' --exclude='.git' ./ ./.package/project_root/
      displayName: 'Create venv, install deps (incl. openpyxl), copy source to artifact'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '.package'
        artifact: '$(artifactName)'
        publishLocation: 'pipeline'
      displayName: 'Publish pipeline artifact'

# ======================================
# Stage 2: Deploy to POC1 — per-module approvals
# ======================================
- stage: deploy_poc1
  displayName: Deploy to POC1 (per module approvals)
  dependsOn: build
  jobs:
    - ${{ each m in parameters.modules }}:
      - deployment: deploy_${{ replace(m.name, ' ', '_') }}_POC1
        displayName: Deploy ${{ m.name }} (POC1)
        environment: 'POC1'
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: self
                persistCredentials: true
                path: s
              - download: current
                artifact: '$(artifactName)'
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '$(pythonVersion)'
                  addToPath: true
              - bash: |
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  python -m venv .venv
                  source .venv/bin/activate
                  python -m pip install --upgrade pip
                  pip install --no-cache-dir requests pandas openpyxl
                  which python
                  python --version
                displayName: 'Create venv & install dependencies'
              # Secure files used by the Python script
              - task: DownloadSecureFile@1
                name: authJson
                inputs:
                  secureFile: 'authentication.json'
              - task: DownloadSecureFile@1
                name: payloadJson
                inputs:
                  secureFile: 'payload.json'
              - task: DownloadSecureFile@1
                name: deploymentJson
                inputs:
                  secureFile: 'deployment.json'
              - bash: |
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  cp "$(authJson.secureFilePath)" authentication.json
                  cp "$(payloadJson.secureFilePath)" payload.json
                  cp "$(deploymentJson.secureFilePath)" deployment.json
                  SRC_DIR="$(Build.SourcesDirectory)"
                  DEST_DIR="Deployment_Automation"
                  mkdir -p "$DEST_DIR"
                  CANDIDATES=(
                    "$SRC_DIR/Deployment_Automation/GVault_Deployment_Steps.csv"
                    "$SRC_DIR/GVault_Deployment_Steps.csv"
                  )
                  FOUND=""
                  for f in "${CANDIDATES[@]}"; do
                    if [[ -f "$f" ]]; then FOUND="$f"; break; fi
                  done
                  if [[ -z "$FOUND" ]]; then
                    echo "ERROR: GVault_Deployment_Steps.csv not found in repo."; exit 1
                  fi
                  cp -v "$FOUND" "$DEST_DIR/GVault_Deployment_Steps.csv"
                displayName: 'Copy CSV to working directory'
              # Filter CSV to the current module
              - bash: |
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  source .venv/bin/activate
                  python - <<'PY'
import pandas as pd
from pathlib import Path
module = r"${{ m.name }}"
p = Path('Deployment_Automation/GVault_Deployment_Steps.csv')
df = pd.read_csv(p)
if 'Module Name' not in df.columns:
    raise SystemExit("CSV must contain 'Module Name' column")
filtered = df[df['Module Name'].astype(str).str.strip() == module]
if filtered.empty:
    raise SystemExit(f"No rows found for module '{module}' in CSV.")
filtered.to_csv(p, index=False)
print(f"Filtered CSV to module: {module}; rows: {len(filtered)}")
PY
                displayName: 'Filter CSV to this module only'
              # Module-specific approval gate
              - task: ManualValidation@0
                displayName: "Approval: ${{ m.name }} (POC1)"
                inputs:
                  notifyUsers: |
                    ${{ join(m.poc1Approvers, '\n') }}
                  instructions: |
                    Please approve deployment for module "${{ m.name }}" to POC1.
                    Policy: ${{ m.poc1Policy }}${{ ' N=' }}${{ m.poc1N }} (informational; not enforced by task)
                    The job reads CSV filtered to this module only.
                  onTimeout: 'reject'
                  timeout: '43200'
              # Run the Python deployment script (CSV mode)
              - bash: |
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  source .venv/bin/activate
                  echo "ENVIRONMENT=POC1"
                  ENVIRONMENT=POC1 python Deployment_Automation/gvault_25gr2_deployment.py
                displayName: 'Run deployment script for this module (POC1)'
              # (Optional) Commit back CSV updates
              - bash: |
                  set -e
                  SRC_DIR="$(Pipeline.Workspace)/$(artifactName)/project_root/Deployment_Automation"
                  REPO_DIR="$(Build.SourcesDirectory)/Deployment_Automation"
                  mkdir -p "$REPO_DIR"
                  ls -la "$SRC_DIR" || true
                  cp -f "$SRC_DIR"/*.csv "$REPO_DIR"/ 2>/dev/null || true
                  cd "$(Build.SourcesDirectory)"
                  git --version
                  git config --global --add safe.directory "$(Build.SourcesDirectory)"
                  git config user.name "azure-pipelines"
                  git config user.email "azure-pipelines@local"
                  git add Deployment_Automation/*.csv || true
                  if ! git diff --cached --quiet; then
                    git commit -m "Pipeline: update CSV after deploying module ${{ m.name }} (POC1)"
                    git push origin HEAD:$(Build.SourceBranchName)
                    echo "Pushed CSV updates for module ${{ m.name }}"
                  else
                    echo "No CSV changes to commit for module ${{ m.name }}."
                  fi
                displayName: 'Commit updated CSV (POC1)'
                condition: succeededOrFailed()

# ======================================
# Stage 3: Deploy to CONTIGENCY — per-module approvals
# ======================================
