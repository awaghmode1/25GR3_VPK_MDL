
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

variables:
  DEPLOY_SCRIPT: 'Deployment_Automation/gvault_25gr2_deployment.py'
  LOGS_DIR: 'Deployment_Automation/logs'
  OUTPUT_DIR: 'Deployment_Automation/output_files'
  DEPLOYMENT_LOGS_DIR: 'Deployment_Automation/deployment_logs'

steps:
# Step 1: Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# Step 2: Cache pip dependencies
- task: Cache@2
  inputs:
    key: 'python | "$(Agent.OS)" | requirements'
    path: ~/.cache/pip
    restoreKeys: |
      python | "$(Agent.OS)"

# Step 3: Install dependencies
- script: |
    set -euo pipefail
    python -m pip install --upgrade pip
    pip install requests pandas jsonschema
  displayName: 'Install dependencies'

# Step 4: Decode & validate configuration files from Base64 env variables
- script: |
    set -euo pipefail

    # Ensure variables exist
    for v in AUTH_JSON_B64 PAYLOAD_JSON_B64 DEPLOYMENT_JSON_B64; do
      if [ -z "${!v:-}" ]; then
        echo "ERROR: $v is empty or not defined." >&2
        exit 1
      fi
      echo "$v length: ${#${!v}}"
    done

    # Decode & validate in Python
    python - << 'PY'
import os, sys, re, base64, json

def clean_and_fix(s: str) -> str:
    s = re.sub(r'[\r\n\t ]+', '', s)
    missing = len(s) % 4
    if missing:
        s += '=' * (4 - missing)
    return s

def decode_to_json(var_name: str, out_file: str):
    raw = os.environ.get(var_name, '')
    if not raw:
        print(f"ERROR: {var_name} is empty or not defined.", file=sys.stderr)
        sys.exit(1)

    cleaned = clean_and_fix(raw)
    if not re.fullmatch(r'[A-Za-z0-9+/=]+', cleaned):
        print(f"ERROR: {var_name} contains invalid Base64 characters.", file=sys.stderr)
        sys.exit(1)

    try:
        data = base64.b64decode(cleaned, validate=True)
        text = data.decode('utf-8')
        obj = json.loads(text)
    except Exception as e:
        print(f"ERROR decoding {var_name}: {e}", file=sys.stderr)
        sys.exit(1)

    with open(out_file, 'w', encoding='utf-8') as f:
        f.write(text)
    print(f"{out_file}: OK (size {len(text)} bytes)")
    if isinstance(obj, dict):
        print(f"{out_file} keys: {', '.join(list(obj.keys())[:10])}")

decode_to_json('AUTH_JSON_B64',       'authentication.json')
decode_to_json('PAYLOAD_JSON_B64',    'payload.json')
decode_to_json('DEPLOYMENT_JSON_B64', 'deployment.json')
PY
  displayName: 'Decode & validate configuration files'
  env:
    AUTH_JSON_B64: $(AUTH_JSON_B64)
    PAYLOAD_JSON_B64: $(PAYLOAD_JSON_B64)
    DEPLOYMENT_JSON_B64: $(DEPLOYMENT_JSON_B64)

# Step 5: Optional JSON schema validation
- script: |
    set -euo pipefail
    echo "Validating JSON files against schema..."
    python - << 'PY'
import json, sys
from jsonschema import validate, ValidationError

schema = {
    "type": "object",
    "properties": {
        "deploymentId": {"type": "string"},
        "steps": {"type": "array"}
    },
    "required": ["deploymentId", "steps"]
}

try:
    with open('deployment.json') as f:
        data = json.load(f)
    validate(instance=data, schema=schema)
    print("Schema validation passed.")
except ValidationError as e:
    print(f"Schema validation failed: {e.message}", file=sys.stderr)
    sys.exit(1)
PY
  displayName: 'Validate deployment.json schema'

# Step 6: Debug workspace
- script: |
    set -euo pipefail
    pwd
    ls -R
    echo "Preview CSV (if present):"
    head -n 5 Deployment_Automation/GVault_Deployment_Steps.csv || true
  displayName: 'Debug workspace'

# Step 7: Run deployment script
- script: |
