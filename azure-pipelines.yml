
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

- script: |
    set -euo pipefail
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'

- script: |
    set -euo pipefail

    # Ensure the base64 variables are present
    [ -n "$(AUTH_JSON_B64)" ] || { echo "AUTH_JSON_B64 is empty"; exit 1; }
    [ -n "$(PAYLOAD_JSON_B64)" ] || { echo "PAYLOAD_JSON_B64 is empty"; exit 1; }
    [ -n "$(DEPLOYMENT_JSON_B64)" ] || { echo "DEPLOYMENT_JSON_B64 is empty"; exit 1; }

    # Decode & write the JSON files
    echo "$(AUTH_JSON_B64)"       | base64 -d > authentication.json
    echo "$(PAYLOAD_JSON_B64)"    | base64 -d > payload.json
    echo "$(DEPLOYMENT_JSON_B64)" | base64 -d > deployment.json

    # Validate JSON
    python - << 'PY'
import json,sys
for f in ("authentication.json","payload.json","deployment.json"):
    try:
        with open(f) as fh: json.load(fh)
        print(f"{f}: OK")
    except Exception as e:
        print(f"{f}: INVALID => {e}")
        sys.exit(1)
PY
  displayName: 'Decode & validate configuration files'

- script: |
    set -euo pipefail
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run deployment script'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
