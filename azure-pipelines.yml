
# azure-pipelines.yml

trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1) Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# 2) Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'

# 3) Create config files from pipeline variables (replace with Secure Files or Key Vault in production)
#    In Azure DevOps, define variables AUTH_JSON, PAYLOAD_JSON, DEPLOYMENT_JSON in the pipeline or variable group.
- script: |
    echo "$(AUTH_JSON)" > authentication.json
    echo "$(PAYLOAD_JSON)" > payload.json
    echo "$(DEPLOYMENT_JSON)" > deployment.json
  displayName: 'Create configuration files from variables'

# 4) Optional: verify expected files are present
- script: |
    echo "Workspace:"
    pwd
    echo "Listing files recursively:"
    ls -R
    echo "Showing first lines of input CSV (if present):"
    head -n 5 Deployment_Automation/GVault_Deployment_Steps.csv || true
  displayName: 'Debug workspace'

# 5) Run the deployment script
- script: |
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run deployment script'

# 6) Publish artifacts (logs, outputs)
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
