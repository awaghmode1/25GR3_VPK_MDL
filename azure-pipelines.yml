
# Azure DevOps Pipeline for GVault Deployment Automation (no Python code in YAML)
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true

# Step 2: Create & activate venv and install deps
- script: |
    set -euo pipefail
    python -m venv .venv
    source .venv/bin/activate
    python -m pip install --upgrade pip
    pip install requests pandas
    which python
    python --version
    pip --version
  displayName: 'Create venv and install dependencies'

# Step 3: Download Secure Files (authentication.json, payload.json, deployment.json)
# These reside in Pipelines > Library > Secure files
- task: DownloadSecureFile@1
  name: authJson
  inputs:
    secureFile: 'authentication.json'

- task: DownloadSecureFile@1
  name: payloadJson
  inputs:
    secureFile: 'payload.json'

- task: DownloadSecureFile@1
  name: deploymentJson
  inputs:
    secureFile: 'deployment.json'

# Step 4: Place secure files into the working directory (use correct output vars)
- bash: |
    set -euo pipefail
    echo "Preparing secure files..."
    cp "$(authJson.secureFilePath)" authentication.json
    cp "$(payloadJson.secureFilePath)" payload.json
    cp "$(deploymentJson.secureFilePath)" deployment.json

    echo "Working dir:"
    pwd
    ls -la

    echo "Deployment_Automation tree:"
    ls -R Deployment_Automation || true
  displayName: 'Prepare configuration files (Secure Files)'

# Step 4b: Copy CSV from repository (NOT a secure file)
- bash: |
    set -euo pipefail
    echo "Copying CSV from repository..."

    REPO_CSV="$(Build.SourcesDirectory)/Deployment_Automation/GVault_Deployment_Steps.csv"
    DEST_DIR="Deployment_Automation/input_files"

    mkdir -p "${DEST_DIR}"

    if [[ ! -f "${REPO_CSV}" ]]; then
      echo "ERROR: CSV not found at ${REPO_CSV}"
      echo "Repo contents for debugging:"
      ls -la "$(Build.SourcesDirectory)" || true
      ls -la "$(Build.SourcesDirectory)/Deployment_Automation" || true
      exit 1
    fi

    cp -v "${REPO_CSV}" "${DEST_DIR}/GVault_Deployment_Steps.csv"

    echo "Verify CSV in target folder:"
    ls -la "${DEST_DIR}/"
    head -n 5 "${DEST_DIR}/GVault_Deployment_Steps.csv" || true
  displayName: 'Copy CSV from repository'

# Step 5: Run the Python script (via venv) -- unchanged except for robust flags
- bash: |
    set -euo pipefail
    source .venv/bin/activate
    python Deployment_Automation/gvault_25gr2_deployment_all_sheets_approvers.py
  displayName: 'Run gvault_25gr2_deployment_all_sheets_approvers.py'
