
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

variables:
  AUTH_JSON_B64: "<Base64-encoded-authentication.json>"
  PAYLOAD_JSON_B64: "<Base64-encoded-payload.json>"
  DEPLOYMENT_JSON_B64: "<Base64-encoded-deployment.json>"

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

- script: |
    set -euo pipefail
    python -m pip install --upgrade pip
    python -m pip install requests pandas
  displayName: 'Install Python dependencies'

- script: |
    set -euo pipefail

    for v in AUTH_JSON_B64 PAYLOAD_JSON_B64 DEPLOYMENT_JSON_B64; do
      if [ -z "${!v:-}" ]; then
        echo "ERROR: $v is empty or not defined." >&2
        exit 1
      fi
      echo "$v is present."
    done

    python - << 'PY'
import os, sys, re, base64, json

def clean_and_fix(s: str) -> str:
    s = re.sub(r'[\r\n\t ]+', '', s)
    missing = len(s) % 4
    if missing: s += '=' * (4 - missing)
    return s

def write(var_name, out_path):
    raw = os.environ.get(var_name, '')
    if not raw:
        print(f"ERROR: {var_name} missing", file=sys.stderr)
        sys.exit(1)
    txt = base64.b64decode(clean_and_fix(raw), validate=True).decode('utf-8')
    json.loads(txt)
    os.makedirs(os.path.dirname(out_path), exist_ok=True)
    with open(out_path, 'w', encoding='utf-8') as f:
        f.write(txt)
    print(f"Wrote {out_path}")

dst = os.path.join(os.environ['Build_SourcesDirectory'], 'Deployment_Automation')
write('AUTH_JSON_B64', os.path.join(dst, 'authentication.json'))
write('PAYLOAD_JSON_B64', os.path.join(dst, 'payload.json'))
write('DEPLOYMENT_JSON_B64', os.path.join(dst, 'deployment.json'))
PY
  displayName: 'Decode & validate configuration files'
  workingDirectory: '$(Build.SourcesDirectory)/Deployment_Automation'
  env:
    AUTH_JSON_B64: $(AUTH_JSON_B64)
    PAYLOAD_JSON_B64: $(PAYLOAD_JSON_B64)
    DEPLOYMENT_JSON_B64: $(DEPLOYMENT_JSON_B64)

- script: |
    set -euo pipefail
    python gvault_25gr2_deployment.py
  displayName: 'Run deployment script'
  workingDirectory: '$(Build.SourcesDirectory)/Deployment_Automation'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.SourcesDirectory)/Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.SourcesDirectory)/Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.SourcesDirectory)/Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
