# Multi-stage Azure DevOps pipeline for GVault Deployment Automation
# Stages: build -> deploy_poc1 -> deploy_Contigency

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'
  artifactName: 'Deployment Automation'

stages:
# ======================================
# Stage 1: Build (package + publish)
# ======================================
- stage: build
  displayName: Build & Package
  jobs:
    - job: build_job
      displayName: Build artifact
      steps:
        # (Optional) shorter checkout path to avoid long paths downstream
        - checkout: self
          path: s

        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(pythonVersion)'
            addToPath: true

        - bash: |
            set -euo pipefail
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            # >>> OPENPYXL FIX (build) <<<
            pip install requests pandas openpyxl
            mkdir -p .package/project_root
            rsync -a --exclude='.venv' --exclude='.git' ./ ./.package/project_root/
          displayName: 'Create venv, install deps (incl. openpyxl), copy source to artifact'

        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '.package'
            artifact: '$(artifactName)'
            publishLocation: 'pipeline'
          displayName: 'Publish pipeline artifact'

# ======================================
# Stage 2: Deploy to POC1
# ======================================
- stage: deploy_poc1
  displayName: Deploy to POC1
  dependsOn: build
  jobs:
    - deployment: poc1_deploy
      displayName: Execute script in POC1
      environment: 'POC1'
      strategy:
        runOnce:
          deploy:
            steps:
              # Short checkout path to reduce path length risk
              - checkout: self
                persistCredentials: true
                path: s

              # Download build artifact
              - download: current
                artifact: '$(artifactName)'

              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '$(pythonVersion)'
                  addToPath: true

              - bash: |
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  python -m venv .venv
                  source .venv/bin/activate
                  python -m pip install --upgrade pip
                  # >>> OPENPYXL FIX (POC1) <<<
                  pip install requests pandas openpyxl
                displayName: 'Create venv & install dependencies (POC1)'

              # Secure files
              - task: DownloadSecureFile@1
                name: authJson
                inputs:
                  secureFile: 'authentication.json'
              - task: DownloadSecureFile@1
                name: payloadJson
                inputs:
                  secureFile: 'payload.json'
              - task: DownloadSecureFile@1
                name: deploymentJson
                inputs:
                  secureFile: 'deployment.json'

              # --- FIX 1: Robust copy from repository (XLSX or CSV; root or Deployment_Automation) ---
              - bash: |
                  echo "Copying deployment input from repository..."
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  # Place configs
                  cp "$(authJson.secureFilePath)" authentication.json
                  cp "$(payloadJson.secureFilePath)" payload.json
                  cp "$(deploymentJson.secureFilePath)" deployment.json
                  SRC_DIR="$(Build.SourcesDirectory)"
                  DEST_DIR="Deployment_Automation"
                  mkdir -p "$DEST_DIR"
                  CANDIDATES=(
                    "$SRC_DIR/Deployment_Automation/GVault_Deployment_Steps.xlsx"
                    "$SRC_DIR/GVault_Deployment_Steps.xlsx"
                    "$SRC_DIR/Deployment_Automation/GVault_Deployment_Steps.csv"
                    "$SRC_DIR/GVault_Deployment_Steps.csv"
                  )
                  FOUND=""
                  for f in "${CANDIDATES[@]}"; do
                    if [[ -f "$f" ]]; then
                      FOUND="$f"
                      break
                    fi
                  done
                  if [[ -z "$FOUND" ]]; then
                    echo "ERROR: No GVault_Deployment_Steps.{xlsx|csv} found in repo."
                    echo "Repo listing:"
                    ls -la "$SRC_DIR" || true
                    ls -la "$SRC_DIR/Deployment_Automation" || true
                    exit 1
                  fi
                  ext="${FOUND##*.}"
                  cp -v "$FOUND" "$DEST_DIR/GVault_Deployment_Steps.$ext"
                  echo "Copied: $FOUND -> $DEST_DIR/GVault_Deployment_Steps.$ext"
                displayName: 'Copy deployment input from repository (robust)'

              # Run the Python deployment script (prefers Excel, falls back to CSV)
              - bash: |
                  set -euo pipefail
                  cd "$(Pipeline.Workspace)/$(artifactName)/project_root"
                  source .venv/bin/activate
                  echo "ENVIRONMENT=POC1"
                  ENVIRONMENT=POC1 python Deployment_Automation/gvault_25gr2_deployment_all_sheets_approvers.py
                displayName: 'Run deployment script (POC1)'

              # --- FIX 2: Sync back env CSV if present; else fallback to Excel workbook ---
              - bash: |
                  set -euo pipefail
                  ENV_NAME="POC1"
                  SRC_DIR="$(Pipeline.Workspace)/$(artifactName)/project_root/Deployment_Automation"
                  REPO_DIR="$(Build.SourcesDirectory)/Deployment_Automation"
                  mkdir -p "$REPO_DIR"
                  # Prefer env-named CSV that the script produces in CSV mode
                  LATEST_CSV="$(ls -1t "$SRC_DIR/GVault_Deployment_Steps_${ENV_NAME}_"*.csv 2>/dev/null | head -n 1 || true)"
                  if [[ -n "$LATEST_CSV" ]]; then
                    cp -f "$LATEST_CSV" "$REPO_DIR/GVault_Deployment_Steps_${ENV_NAME}.csv"
                    # (optional) update common name as well
                    cp -f "$REPO_DIR/GVault_Deployment_Steps_${ENV_NAME}.csv" "$REPO_DIR/GVault_Deployment_Steps.csv" || true
                    echo "Synced CSV: ${LATEST_CSV}"
                  else
                    # Excel mode: persist the workbook updated in-place by the script
                    if [[ -f "$SRC_DIR/GVault_Deployment_Steps.xlsx" ]]; then
                      cp -f "$SRC_DIR/GVault_Deployment_Steps.xlsx" "$REPO_DIR/GVault_Deployment_Steps.xlsx"
                      echo "Synced Excel workbook: $SRC_DIR/GVault_Deployment_Steps.xlsx"
                    else
                      echo "ERROR: Neither env CSV nor Excel found in $SRC_DIR"
                      ls -la "$SRC_DIR" || true
                      exit 1
                    fi
                  fi
                displayName: 'Sync updated deployment file(s) to repo checkout (POC1)'

              # Preview (optional)
              - bash: |
                  set -euo pipefail
                  echo "=== Repo checkout listing after sync (POC1) ==="
                  ls -la "$(Build.SourcesDirectory)/Deployment_Automation"
                  # Show head of CSV if present
                  if [[ -f "$(Build.SourcesDirectory)/Deployment_Automation/GVault_Deployment_Steps_POC1.csv" ]]; then
                    echo "Top of env CSV:"
                    head -n 25 "$(Build.SourcesDirectory)/Deployment_Automation/GVault_Deployment_Steps_POC1.csv" || true
                  fi
                displayName: 'Show updated content (POC1)'
              condition: succeededOrFailed()

              # Commit & push (add XLSX and CSV so either mode is versioned)
              - bash: |
                  set -e
                  cd "$(Build.SourcesDirectory)"
                  git --version
                  git config --global --add safe.directory "$(Build.SourcesDirectory)"
                  git config user.name "azure-pipelines"
                  git config user.email "azure-pipelines@local"
                  git add Deployment_Automation/GVault_Deployment_Steps_POC1.csv || true
                  git add Deployment_Automation/GVault_Deployment_Steps.csv || true
                  git add Deployment_Automation/GVault_Deployment_Steps.xlsx || true
                  if ! git diff --cached --quiet; then
                    git commit -m "Pipeline: update deployment steps (POC1)"
                    git push origin HEAD:$(Build.SourceBranchName)
                    echo "Pushed changes to $(Build.SourceBranchName)"
                  else
                    echo "No changes to commit."
                  fi
                displayName: 'Commit & push updates (POC1)'
              condition: succeededOrFailed()
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

# ======================================
# Stage 3: Deploy to CONTIGENCY
# ======================================
- stage: deploy_Contigency
  displayName: Deploy to CONTIGENCY
  dependsOn: build
  jobs:
    - deployment: Contigency_deploy
      displayName: Execute script in CONTIGENCY
      environment: 'Contigency'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                fetchDepth: 0
                persistCredentials: true
                path: s

              - download: current
