
# azure-pipelines.yml
trigger:
- 25GR3

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1) Use Python 3.10
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'

# 2) Install dependencies
- script: |
    set -euo pipefail
    python -m pip install --upgrade pip
    pip install requests pandas
  displayName: 'Install dependencies'

# 3) Create configuration files from variables (define AUTH_JSON, PAYLOAD_JSON, DEPLOYMENT_JSON in pipeline Variables)
- script: |
    set -euo pipefail
    [ -n "$(AUTH_JSON)" ] || { echo "AUTH_JSON is empty"; exit 1; }
    [ -n "$(PAYLOAD_JSON)" ] || { echo "PAYLOAD_JSON is empty"; exit 1; }
    [ -n "$(DEPLOYMENT_JSON)" ] || { echo "DEPLOYMENT_JSON is empty"; exit 1; }

    printf '%s' "$(AUTH_JSON)"       > authentication.json
    printf '%s' "$(PAYLOAD_JSON)"    > payload.json
    printf '%s' "$(DEPLOYMENT_JSON)" > deployment.json

    # Validate JSON
    python - << 'PY'
import json,sys
for f in ("authentication.json","payload.json","deployment.json"):
    try:
        with open(f) as fh: json.load(fh)
        print(f"{f}: OK")
    except Exception as e:
        print(f"{f}: INVALID => {e}")
        sys.exit(1)
PY
  displayName: 'Create & validate configuration files'

# 4) Optional: debug the workspace
- script: |
    pwd
    ls -R
    head -n 5 Deployment_Automation/GVault_Deployment_Steps.csv || true
  displayName: 'Debug workspace listing'

# 5) Run your script
- script: |
    set -euo pipefail
    python Deployment_Automation/gvault_25gr2_deployment.py
  displayName: 'Run deployment script'

# 6) Publish artifacts (always)
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/logs'
    artifactName: 'logs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/output_files'
    artifactName: 'outputs'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'Deployment_Automation/deployment_logs'
    artifactName: 'deployment_logs'
  condition: succeededOrFailed()
